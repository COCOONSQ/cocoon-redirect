<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可可尼看板 · 入口</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #f8f4f2 0%, #f1e8e4 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #3e2723;
  }
  .wrap {
    max-width: 420px;
    width: 92%;
  }
  .card {
    background: rgba(255,255,255,0.96);
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(60,20,10,0.10);
    padding: 40px 34px;
    text-align: center;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.8);
  }
  .brand {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    background: linear-gradient(135deg, #b14438 0%, #c0392b 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 28px;
    box-shadow: 0 6px 16px rgba(176,68,56,0.28);
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #4a2c28;
    margin-bottom: 6px;
  }
  .tagline {
    font-size: 13px;
    color: #8d6e63;
    margin-bottom: 28px;
  }

  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid #f3e9e6;
    border-top-color: #b14438;
    border-radius: 50%;
    animation: spin 0.85s linear infinite;
    margin: 0 auto 22px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status {
    font-size: 15px;
    color: #5d4037;
    line-height: 1.6;
  }
  .url-box {
    margin-top: 18px;
    padding: 12px;
    background: #faf6f4;
    border: 1px solid #efe5e1;
    border-radius: 10px;
    font-size: 12px;
    word-break: break-all;
    color: #6d4c41;
    display: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .url-box.show { opacity: 1; transform: translateY(0); }
  .manual-btn {
    display: none;
    margin-top: 18px;
    padding: 11px 22px;
    background: #fff;
    color: #b14438;
    border: 1px solid #b14438;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .manual-btn.show { opacity: 1; transform: translateY(0); }
  .retry-btn {
    display: none;
    margin-top: 18px;
    padding: 11px 22px;
    background: #b14438;
    color: #fff;
    border: 1px solid #b14438;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .retry-btn.show { opacity: 1; transform: translateY(0); }
  .footer {
    margin-top: 18px;
    font-size: 12px;
    color: #a1887f;
  }
  .progress-bar {
    width: 220px;
    height: 4px;
    background: #efe5e1;
    border-radius: 2px;
    margin: 18px auto 0;
    overflow: hidden;
  }
  .progress-fill {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #b14438, #d86c5f);
    border-radius: 2px;
    animation: progress 2.2s ease-in-out forwards;
  }
  @keyframes progress {
    0% { width: 0%; }
    40% { width: 60%; }
    100% { width: 92%; }
  }
  .fade-in { animation: fadeIn .45s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 480px) {
    .card { padding: 34px 24px; }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand">🛒</div>
    <h1>可可尼上新看板</h1>
    <div class="tagline">COCOON · 产品上市数据大屏</div>

    <div class="loading" id="loadingBox">
      <div class="spinner"></div>
      <div class="status fade-in" id="status">正在连接实时数据...</div>
      <div class="progress-bar" id="progressBar"><div class="progress-fill"></div></div>
      <div class="url-box" id="urlBox"></div>
      <a class="manual-btn" id="manualBtn" href="#" target="_blank">手动打开看板</a>
      <button class="retry-btn" id="retryBtn" onclick="enterBoard()">重 试</button>
      <div class="footer">固定入口页不会失效；实时看板地址由服务端自动维护，请勿收藏/刷新临时地址</div>
    </div>
  </div>
</div>

<script>
const TUNNEL_URL_TXT = 'tunnel_url.txt?t=' + Date.now();
const statusEl = document.getElementById('status');
const urlBox = document.getElementById('urlBox');
const manualBtn = document.getElementById('manualBtn');
const progressBar = document.getElementById('progressBar');
const retryBtn = document.getElementById('retryBtn');

function showError(msg) {
  const spinner = document.querySelector('.spinner');
  if (spinner) spinner.style.display = 'none';
  if (progressBar) progressBar.style.display = 'none';
  statusEl.innerHTML = '<span style="color:#c62828">' + msg + '</span>';
  if (retryBtn) {
    retryBtn.style.display = 'inline-block';
    setTimeout(() => retryBtn.classList.add('show'), 10);
  }
}

function showFallback(url, base) {
  if (urlBox) { urlBox.style.display = 'block'; urlBox.textContent = base; setTimeout(() => urlBox.classList.add('show'), 10); }
  if (manualBtn) { manualBtn.style.display = 'inline-block'; manualBtn.href = url; setTimeout(() => manualBtn.classList.add('show'), 10); }
  statusEl.innerHTML = '<span style="color:#8d6e63">自动跳转失败，请手动打开</span>';
}

function fetchWithTimeout(url, init, timeoutMs) {
  const controller = new AbortController();
  let timedOut = false;
  const timer = setTimeout(function() {
    timedOut = true;
    controller.abort();
  }, timeoutMs);
  return fetch(url, Object.assign({ cache: 'no-store' }, init || {}, { signal: controller.signal }))
    .then(function(r) { clearTimeout(timer); return r; })
    .catch(function(e) {
      clearTimeout(timer);
      if (timedOut || (e && e.name === 'AbortError')) {
        throw new Error('请求超时（>' + Math.round(timeoutMs / 1000) + '秒），请检查网络后重试');
      }
      throw e;
    });
}

async function enterBoard() {
  try {
    const r = await fetchWithTimeout(TUNNEL_URL_TXT, null, 8000);
    const url = (await r.text()).trim();
    if (!url || url === 'INIT' || !/^https?:\/\//.test(url)) throw new Error('看板地址暂不可用');
    const base = url.replace(/\/$/, '');
    // 直接在当前标签跳转看板；window.location.href 为同步导航，不会被浏览器弹窗拦截
    window.location.href = base + '/progress';
  } catch (e) {
    showError('无法进入看板：' + (e.message || '网络错误'));
  }
}

enterBoard();
</script>
</body>
</html>
