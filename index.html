<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可可尼看板 · 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #f8f4f2 0%, #f1e8e4 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #3e2723;
  }
  .wrap {
    max-width: 420px;
    width: 92%;
  }
  .card {
    background: rgba(255,255,255,0.96);
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(60,20,10,0.10);
    padding: 40px 34px;
    text-align: center;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.8);
  }
  .brand {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    background: linear-gradient(135deg, #b14438 0%, #c0392b 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 28px;
    box-shadow: 0 6px 16px rgba(176,68,56,0.28);
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #4a2c28;
    margin-bottom: 6px;
  }
  .tagline {
    font-size: 13px;
    color: #8d6e63;
    margin-bottom: 28px;
  }

  .form { display: none; }
  .form.active { display: block; }
  .input-group {
    text-align: left;
    margin-bottom: 16px;
  }
  .input-group label {
    display: block;
    font-size: 13px;
    color: #6d4c41;
    margin-bottom: 6px;
  }
  .input-group input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #e0d6d2;
    border-radius: 10px;
    font-size: 15px;
    background: #fff;
    color: #3e2723;
    transition: border-color .2s, box-shadow .2s;
  }
  .input-group input:focus {
    outline: none;
    border-color: #b14438;
    box-shadow: 0 0 0 3px rgba(177,68,56,0.12);
  }
  .btn {
    width: 100%;
    padding: 13px 16px;
    margin-top: 8px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #b14438 0%, #c0392b 100%);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(176,68,56,0.22);
    transition: transform .15s, box-shadow .15s;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled {
    opacity: 0.7;
    cursor: wait;
  }
  .error {
    margin-top: 14px;
    color: #c62828;
    font-size: 13px;
    min-height: 18px;
  }

  .loading { display: none; }
  .loading.active { display: block; }
  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid #f3e9e6;
    border-top-color: #b14438;
    border-radius: 50%;
    animation: spin 0.85s linear infinite;
    margin: 0 auto 22px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status {
    font-size: 15px;
    color: #5d4037;
    line-height: 1.6;
  }
  .url-box {
    margin-top: 18px;
    padding: 12px;
    background: #faf6f4;
    border: 1px solid #efe5e1;
    border-radius: 10px;
    font-size: 12px;
    word-break: break-all;
    color: #6d4c41;
    display: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .url-box.show { opacity: 1; transform: translateY(0); }
  .manual-btn {
    display: none;
    margin-top: 18px;
    padding: 11px 22px;
    background: #fff;
    color: #b14438;
    border: 1px solid #b14438;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .manual-btn.show { opacity: 1; transform: translateY(0); }
  .reopen-btn {
    display: none;
    margin-top: 18px;
    padding: 11px 22px;
    background: #b14438;
    color: #fff;
    border: 1px solid #b14438;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .reopen-btn.show { opacity: 1; transform: translateY(0); }
  .footer {
    margin-top: 18px;
    font-size: 12px;
    color: #a1887f;
  }
  .progress-bar {
    width: 220px;
    height: 4px;
    background: #efe5e1;
    border-radius: 2px;
    margin: 18px auto 0;
    overflow: hidden;
    display: none;
  }
  .progress-bar.active { display: block; }
  .progress-fill {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #b14438, #d86c5f);
    border-radius: 2px;
    animation: progress 2.2s ease-in-out forwards;
  }
  @keyframes progress {
    0% { width: 0%; }
    40% { width: 60%; }
    100% { width: 92%; }
  }
  .fade-in { animation: fadeIn .45s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 480px) {
    .card { padding: 34px 24px; }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <!-- 登录表单 -->
    <div id="loginForm" class="form active">
      <div class="brand">🛒</div>
      <h1>可可尼上新看板</h1>
      <div class="tagline">COCOON · 产品上市数据大屏</div>
      <div class="input-group">
        <label for="username">账号</label>
        <input id="username" type="text" placeholder="请输入账号" autocomplete="username">
      </div>
      <div class="input-group">
        <label for="password">密码</label>
        <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button class="btn" id="loginBtn" onclick="doLogin()">登 录</button>
      <div class="error" id="loginError"></div>
    </div>

    <!-- 加载 / 跳转 -->
    <div id="loadingBox" class="loading">
      <div class="spinner"></div>
      <div class="status fade-in" id="status">正在连接实时数据...</div>
      <div class="progress-bar" id="progressBar"><div class="progress-fill"></div></div>
      <div class="url-box" id="urlBox"></div>
      <a class="manual-btn" id="manualBtn" href="#" target="_blank">手动打开看板</a>
      <button class="reopen-btn" id="reopenBtn" onclick="reopenBoard()">重新打开看板</button>
      <div class="footer">固定入口页不会失效；实时看板地址由服务端自动维护，请勿收藏/刷新临时地址</div>
    </div>
  </div>
</div>

<script>
const TUNNEL_URL_TXT = 'tunnel_url.txt?t=' + Date.now();
const TOKEN_KEY = 'cocoon_board_token';

const loginForm = document.getElementById('loginForm');
const loadingBox = document.getElementById('loadingBox');
const statusEl = document.getElementById('status');
const urlBox = document.getElementById('urlBox');
const manualBtn = document.getElementById('manualBtn');
const progressBar = document.getElementById('progressBar');
const loginError = document.getElementById('loginError');

let fallbackTimer = null;

// 已登录且 token 未过期则显示"打开看板"按钮（不自动弹窗，避免被浏览器拦截）
let currentToken = null;
let currentTunnelBase = null;
const saved = localStorage.getItem(TOKEN_KEY);
if (saved) {
  try {
    const s = JSON.parse(saved);
    if (s.token && s.expires && Date.now() < s.expires) {
      currentToken = s.token;
      showLoading();
      statusEl.innerHTML = '<span style="color:#2e7d32">已登录</span><br><small style="color:#8d6e63">请点击下方按钮打开看板</small>';
      if (progressBar) progressBar.style.display = 'none';
      const spinner = loadingBox.querySelector('.spinner');
      if (spinner) spinner.style.display = 'none';
      const btn = document.getElementById('reopenBtn');
      if (btn) { btn.textContent = '打开看板'; btn.style.display = 'inline-block'; setTimeout(() => btn.classList.add('show'), 10); }
    }
  } catch (e) { localStorage.removeItem(TOKEN_KEY); }
}

function showLoading() {
  loginForm.classList.remove('active');
  loadingBox.classList.add('active');
  if (progressBar) progressBar.classList.add('active');
}

function showError(msg) {
  loadingBox.querySelector('.spinner').style.display = 'none';
  if (progressBar) progressBar.style.display = 'none';
  statusEl.innerHTML = '<span style="color:#c62828">' + msg + '</span>';
}

function showFallback(url, base) {
  if (urlBox) { urlBox.style.display = 'block'; urlBox.textContent = base; setTimeout(() => urlBox.classList.add('show'), 10); }
  if (manualBtn) { manualBtn.style.display = 'inline-block'; manualBtn.href = url; setTimeout(() => manualBtn.classList.add('show'), 10); }
  statusEl.innerHTML = '<span style="color:#8d6e63">自动跳转似乎被拦截，请手动打开</span>';
}

function fetchWithTimeout(url, init, timeoutMs) {
  // 通用 fetch 包装：传入 init 可指定 method/headers/body；ms 内未响应则 abort 并 reject('请求超时（>Xs）')。
  // 关键修复：doLogin 里的 fetch 一旦挂起会让用户永远卡在"正在获取看板地址..."。
  const controller = new AbortController();
  let timedOut = false;
  const timer = setTimeout(function() {
    timedOut = true;
    controller.abort();
  }, timeoutMs);
  return fetch(url, Object.assign({ cache: 'no-store' }, init || {}, { signal: controller.signal }))
    .then(function(r) { clearTimeout(timer); return r; })
    .catch(function(e) {
      clearTimeout(timer);
      if (timedOut || (e && e.name === 'AbortError')) {
        throw new Error('请求超时（>' + Math.round(timeoutMs / 1000) + '秒），请检查网络后重试');
      }
      throw e;
    });
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}

function showErrorAndRetry(msg) {
  // 关键修复：错误时**不**回到登录表单（避免用户重新输入密码），而是
  // 保留 loadingBox 状态显示具体错误和重试按钮。所有错误都用 escapeHtml 防 XSS。
  const spinner = loadingBox.querySelector('.spinner');
  if (spinner) spinner.style.display = 'none';
  if (progressBar) progressBar.style.display = 'none';
  statusEl.innerHTML = '<span style="color:#c62828">' + escapeHtml(msg) + '</span>';
  const btn = document.getElementById('reopenBtn');
  if (btn) {
    btn.textContent = '重新登录';
    btn.onclick = function() { location.reload(); };
    btn.style.display = 'inline-block';
    btn.classList.add('show');
  }
}

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) {
    loginError.textContent = '请输入账号和密码';
    return;
  }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = '登录中...';
  loginError.textContent = '';

  // 直接进入 loading 状态：所有错误和重试都显示在 loadingBox，不再回到 loginForm
  showLoading();
  statusEl.textContent = '正在获取看板地址...';

  // 1. 获取 tunnel 地址（8 秒超时）
  let tunnelUrl;
  try {
    const r = await fetchWithTimeout(TUNNEL_URL_TXT, null, 8000);
    tunnelUrl = (await r.text()).trim();
  } catch (e) {
    showErrorAndRetry('获取看板地址失败：' + (e.message || '网络错误'));
    btn.disabled = false; btn.textContent = '登 录';
    return;
  }
  if (!tunnelUrl || tunnelUrl === 'INIT' || !/^https?:\/\//.test(tunnelUrl)) {
    showErrorAndRetry('看板地址暂不可用，请稍后重试');
    btn.disabled = false; btn.textContent = '登 录';
    return;
  }

  // 2. 到看板服务端验证账号密码（15 秒超时）
  statusEl.textContent = '正在验证身份...';
  let authData;
  try {
    const authResp = await fetchWithTimeout(
      tunnelUrl.replace(/\/$/, '') + '/api/auth',
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      },
      15000
    );
    authData = await authResp.json();
  } catch (e) {
    showErrorAndRetry('验证身份失败：' + (e.message || '网络错误'));
    btn.disabled = false; btn.textContent = '登 录';
    return;
  }
  if (!authData.ok || !authData.token) {
    showErrorAndRetry(authData.error || '账号或密码错误');
    btn.disabled = false; btn.textContent = '登 录';
    return;
  }

  // 3. 保存 token（24 小时有效）
  localStorage.setItem(TOKEN_KEY, JSON.stringify({
    token: authData.token,
    expires: Date.now() + 24 * 60 * 60 * 1000,
    role: authData.role || 'user'
  }));

  // 4. 打开看板：在新标签页打开，保留本固定入口页
  currentToken = authData.token;
  openBoard(authData.token, tunnelUrl);
}

function openBoard(token, tunnelUrl) {
  if (!tunnelUrl) {
    statusEl.innerHTML = '正在获取最新看板地址...';
    if (progressBar) progressBar.style.display = 'block';
    fetch(TUNNEL_URL_TXT, { cache: 'no-store' })
      .then(r => r.text())
      .then(url => openBoard(token, url.trim()))
      .catch(() => showError('无法获取看板地址，请刷新重试'));
    return;
  }
  const base = tunnelUrl.replace(/\/$/, '');
  const url = base + '/login?token=' + encodeURIComponent(token) + '&next=' + encodeURIComponent('/progress');
  currentTunnelBase = base;
  currentToken = token;

  statusEl.innerHTML = '<span style="color:#2e7d32">登录成功，正在进入看板...</span>';
  showLoading();

  // 关键修复：直接在当前标签跳转，避免 window.open 被浏览器拦截导致卡在登录页
  // /login?token=... 会在服务端写入 HttpOnly+Secure cookie，再 302 到 /progress
  window.location.href = url;
}

function reopenBoard() {
  if (!currentToken || !currentTunnelBase) {
    location.reload();
    return;
  }
  const btn = document.getElementById('reopenBtn');
  if (btn) { btn.classList.remove('show'); }
  openBoard(currentToken, currentTunnelBase);
}

// 回车提交
['username','password'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
});
</script>
</body>
</html>
